[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-gate"
version = "0.2.1"
description = "The AI Action Firewall — policy engine, PII redaction, HMAC-SHA256 audit chains, Slack approvals, and framework integrations for EU AI Act compliance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Jason Shotwell", email = "jason@airblackbox.ai" },
]
keywords = ["ai", "compliance", "eu-ai-act", "audit", "agents", "langchain", "openai", "safety", "firewall", "pii", "gdpr", "hipaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
crypto = [
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "cryptography>=42.0.0",
]

[project.scripts]
air-gate = "air_gate.cli:main"

[project.urls]
Homepage = "https://airblackbox.ai"
Repository = "https://github.com/airblackbox/air-gate"
Documentation = "https://airblackbox.ai/quickstart"
Issues = "https://github.com/airblackbox/air-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["air_gate"]

[tool.ruff]
line-length = 120
select = ["E", "F"]
ignore = ["E501"]
